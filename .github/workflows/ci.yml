name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: housing-data-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: housing-data-app/package-lock.json

      - run: npm ci

      # Lint is advisory until the Phase 3 cleanup clears the pre-existing
      # findings; it still runs so new problems are visible in the log.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc -b

      # Build with production-shaped env so the bundle exercises split mode.
      - name: Build
        run: npm run build
        env:
          VITE_USE_SPLIT_CSV: 'true'
          VITE_MARKET_DATA_URL: https://storage.googleapis.com/housing-data-markets
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-placeholder

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js dist/assets/*.css | awk '{print "- " $2 ": " $1}' >> "$GITHUB_STEP_SUMMARY"

  pipeline:
    name: Pipeline scripts (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  nginx:
    name: nginx config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: |
          SNIPPET=""
          if [ -f nginx-security-headers.conf ]; then
            SNIPPET="-v $PWD/nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro"
          fi
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            $SNIPPET \
            nginx:alpine nginx -t
