name: Refresh Zillow data

# Zillow publishes city-level ZHVI/ZORI roughly mid-month, but the exact day
# drifts. Polling weekly costs nothing (the script exits early when the
# latest month is already published) and never misses a release.
on:
  schedule:
    - cron: '0 14 * * 2' # Tuesdays 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Download, validate, split and show the rsync plan; publish nothing
        type: boolean
        default: false
      force:
        description: Re-publish even if the latest month is unchanged
        type: boolean
        default: false

permissions:
  contents: write   # commit scripts/data/manifest.json
  id-token: write   # Workload Identity Federation to GCP
  issues: write     # open an issue on failure

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GCLOUD_PROJECT: housing-data-476414
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_REFRESH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Refresh
        run: >
          npm run refresh-data --
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.force && '--force' || '' }}

      - name: Commit manifest (audit trail)
        if: ${{ success() && !inputs.dry_run }}
        run: |
          if [ ! -f scripts/data/manifest.json ]; then
            echo "No manifest written (no new data); nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged; nothing to commit."
            exit 0
          fi
          VERSION=$(node -p "require('./scripts/data/manifest.json').dataVersion")
          git commit -m "chore(data): refresh Zillow data to ${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Data refresh failed ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `The scheduled Zillow data refresh failed.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Common causes: Zillow changed a file URL or schema (validation fails on purpose), `,
              `GCP credentials/IAM drift, or a transient download error. Re-run the workflow `,
              `manually with \`dry_run\` to inspect.`,
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'data-refresh',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['bug', 'data-refresh'],
              });
            }
