# Cloud Build: build the housing-data-app image and deploy it to Cloud Run.
# Triggered by pushes to the `prod` branch (trigger is configured in the GCP console).
#
# Vite embeds every VITE_* value into the public JS bundle at build time, so
# none of these are secret in the usual sense. The Firebase web config still
# comes from Secret Manager because that is where it already lives; the plain
# deployment settings are substitutions here so a change is a one-line PR
# instead of a new secret version.

substitutions:
  _REGION: us-central1
  _SERVICE: housingdata
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/housingdata/housingdata
  _VITE_USE_SPLIT_CSV: 'true'
  _VITE_MARKET_DATA_URL: https://storage.googleapis.com/housing-data-markets
  _VITE_DEFAULT_CSV_URL: https://storage.googleapis.com/housing-data-assets-476414/default-housing-data.csv

steps:
  # Build. Tags: commit SHA (what gets deployed), app version from package.json, latest.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' housing-data-app/package.json | head -1)
        echo "Building ${_SERVICE} v$${VERSION} @ ${SHORT_SHA}"
        docker build \
          --build-arg "VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY" \
          --build-arg "VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN" \
          --build-arg "VITE_FIREBASE_PROJECT_ID=$$VITE_FIREBASE_PROJECT_ID" \
          --build-arg "VITE_FIREBASE_STORAGE_BUCKET=$$VITE_FIREBASE_STORAGE_BUCKET" \
          --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=$$VITE_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg "VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID" \
          --build-arg "VITE_USE_SPLIT_CSV=${_VITE_USE_SPLIT_CSV}" \
          --build-arg "VITE_MARKET_DATA_URL=${_VITE_MARKET_DATA_URL}" \
          --build-arg "VITE_DEFAULT_CSV_URL=${_VITE_DEFAULT_CSV_URL}" \
          -t "${_IMAGE}:${SHORT_SHA}" \
          -t "${_IMAGE}:v$${VERSION}" \
          -t "${_IMAGE}:latest" \
          .
    secretEnv:
      - VITE_FIREBASE_API_KEY
      - VITE_FIREBASE_AUTH_DOMAIN
      - VITE_FIREBASE_PROJECT_ID
      - VITE_FIREBASE_STORAGE_BUCKET
      - VITE_FIREBASE_MESSAGING_SENDER_ID
      - VITE_FIREBASE_APP_ID

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  # Deploy with explicit sizing. nginx serving static files handles far more
  # than the default 80 concurrent requests per instance, and a public
  # unauthenticated service needs a ceiling on instances so a scraper cannot
  # scale up a bill. Min instances stays 0; cold start for nginx is ~1s.
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=256Mi
      - --concurrency=250
      - --min-instances=0
      - --max-instances=5
      - --cpu-boost
      - --timeout=60
      - --labels=app=housingdata,commit=${SHORT_SHA}

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_API_KEY/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest
      env: VITE_FIREBASE_AUTH_DOMAIN
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_PROJECT_ID/versions/latest
      env: VITE_FIREBASE_PROJECT_ID
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_STORAGE_BUCKET/versions/latest
      env: VITE_FIREBASE_STORAGE_BUCKET
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: VITE_FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/${PROJECT_ID}/secrets/VITE_FIREBASE_APP_ID/versions/latest
      env: VITE_FIREBASE_APP_ID

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
