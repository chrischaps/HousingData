# Security headers, included in every `location` block of nginx.conf.
#
# nginx's add_header is NOT inherited into a location that declares its own
# add_header, so putting these at server level silently dropped them from
# CSV and static-asset responses. Including this file per location is the
# reliable way to get them everywhere.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Content Security Policy.
#
# What the app actually talks to:
#   script-src   Vite bundle ('self') + Google's gapi loader, which the Firebase
#                Auth SDK injects for the Google sign-in popup.
#   style-src    Tailwind is compiled, but Recharts sets inline styles.
#   img-src      Google profile photos come from *.googleusercontent.com.
#   connect-src  market data bucket; Firebase Auth (identitytoolkit,
#                securetoken); Firestore.
#   frame-src    Firebase Auth helper iframe on the project's authDomain and
#                Google's account chooser.
#   frame-ancestors 'self' is the modern form of X-Frame-Options SAMEORIGIN.
#
# If the Firebase authDomain changes, update the frame-src host below.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://storage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://apis.google.com; frame-src https://ccc-housing-data.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
