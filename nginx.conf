server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json text/csv;

    # Cloud Run probes and uptime checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The SPA shell must never be cached: it is the only file whose name does
    # not change between deploys, and it points at the hashed assets below.
    # Caching it pins users to an old bundle.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets: safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Local-mode CSVs (production fetches these from Cloud Storage instead).
    # Not immutable: they are overwritten in place on refresh.
    location ~* \.csv$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/csv;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA routing: everything else falls back to index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
